name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hosted-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical-runtime gateway and worker
        run: docker build -t hosaka-hosted:test .
      - name: Test hosted auth, model quotas and cleanup
        run: |
          docker run --rm --entrypoint /opt/hosaka-field-terminal/.venv/bin/python \
            -v "$PWD/agent-server/test_hosted_terminal.py:/app/test_hosted_terminal.py:ro" \
            hosaka-hosted:test -m unittest -v test_hosted_terminal
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync frontend from console
        run: bash scripts/sync-console.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck & build
        working-directory: frontend
        run: npm run build

      - name: Typecheck api/ (edge function)
        run: npx -y -p typescript@5.6 tsc -p api/tsconfig.json
